<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Leave Extractor - ViT5 GPU</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; }
        h1 { color: #2c3e50; }
        textarea { width: 100%; height: 180px; padding: 10px; font-size: 16px; }
        button { padding: 12px 24px; background: #3498db; color: white; border: none; cursor: pointer; }
        button:hover { background: #2980b9; }
        pre { background: #ecf0f1; padding: 15px; border-radius: 8px; overflow-x: auto; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Trích xuất thông tin nghỉ phép từ email</h1>
    
    <form action="/" method="post">
        <label for="email_text">Nội dung email:</label><br>
        <textarea id="email_text" name="email_text" placeholder="Dán nội dung email vào đây..."></textarea><br><br>
        <button type="submit">Trích xuất</button>
    </form>

    {% if result %}
    <h2>Kết quả:</h2>
    {% if result.error %}
        <p class="error">{{ result.error }}</p>
        {% if result.raw_output %}
            <pre>{{ result.raw_output }}</pre>
        {% endif %}
    {% else %}
        <pre>{{ result | tojson(indent=4) }}</pre>
    {% endif %}
    {% endif %}
</body>
</html>
